name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check forca tests scripts
      - run: ruff format --check forca tests scripts
      - run: pytest --cov=forca --cov-report=term

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forca .
      - name: O container sobe e responde
        run: |
          docker run -d --name forca -e FORCA_PASSWORD=teste forca
          for _ in $(seq 1 30); do
            docker exec forca python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/manifest.webmanifest', timeout=2)" && exit 0
            sleep 2
          done
          docker logs forca
          exit 1
